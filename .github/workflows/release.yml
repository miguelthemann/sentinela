name: Release Sentinela

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de versão para lançamento (ex: v0.3.0)'
        required: false
        default: 'v0.3.0'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: sentinela
            asset_name: sentinela-linux-x86_64
            archive_format: tar.gz
          # Linux ARM64 (Raspberry Pi / Servidores ARM)
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: sentinela
            asset_name: sentinela-linux-arm64
            archive_format: tar.gz
            cross: true
          # Windows x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: sentinela.exe
            asset_name: sentinela-windows-x64
            archive_format: zip
          # macOS Apple Silicon (M1/M2/M3/M4)
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: sentinela
            asset_name: sentinela-macos-arm64
            archive_format: tar.gz
          # macOS Intel (x86_64)
          - os: macos-13
            target: x86_64-apple-darwin
            artifact_name: sentinela
            asset_name: sentinela-macos-x64
            archive_format: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install aarch64 cross-linker (Linux ARM64)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build Release Binary
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          fi
          cargo build --release --target ${{ matrix.target }}

      - name: Package Release Assets (Unix - tar.gz, deb, rpm)
        if: matrix.archive_format == 'tar.gz'
        shell: bash
        run: |
          # 1. Tarball com script de instalação
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} dist/
          cp install.sh dist/
          cp README.md dist/
          cp LICENSE dist/
          cd dist
          chmod +x sentinela install.sh
          tar -czf ../${{ matrix.asset_name }}.tar.gz *
          cd ..
          shasum -a 256 ${{ matrix.asset_name }}.tar.gz > ${{ matrix.asset_name }}.tar.gz.sha256

          # 2. Se for Linux, gera pacote nativo .deb (e .rpm em x86_64)
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            DEB_ARCH="amd64"
            if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
              DEB_ARCH="arm64"
            fi

            DEB_ROOT="sentinela_pkg"
            mkdir -p "${DEB_ROOT}/DEBIAN"
            mkdir -p "${DEB_ROOT}/usr/local/bin"
            mkdir -p "${DEB_ROOT}/usr/share/doc/sentinela"

            cp "target/${{ matrix.target }}/release/sentinela" "${DEB_ROOT}/usr/local/bin/"
            chmod 755 "${DEB_ROOT}/usr/local/bin/sentinela"
            cp README.md LICENSE "${DEB_ROOT}/usr/share/doc/sentinela/"

            cat << EOF > "${DEB_ROOT}/DEBIAN/control"
Package: sentinela
Version: 0.3.0
Section: utils
Priority: optional
Architecture: ${DEB_ARCH}
Maintainer: Salvador Pontes <123838416+teizinh@users.noreply.github.com>
Description: Sentinela - Honeypot & Network Intrusion Detection System
 Sistema leve de detecao de intrusoes (NIDS) e armadilhas honeypot em Rust.
EOF

            cat << 'EOF' > "${DEB_ROOT}/DEBIAN/postinst"
#!/bin/sh
set -e
if command -v setcap >/dev/null 2>&1; then
    setcap cap_net_raw+eip /usr/local/bin/sentinela 2>/dev/null || true
fi
EOF
            chmod 755 "${DEB_ROOT}/DEBIAN/postinst"

            dpkg-deb --build "${DEB_ROOT}" "${{ matrix.asset_name }}.deb"
            shasum -a 256 "${{ matrix.asset_name }}.deb" > "${{ matrix.asset_name }}.deb.sha256"
            rm -rf "${DEB_ROOT}"

            # Para Linux x86_64, gera também pacote .rpm via alien
            if [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ]; then
              sudo apt-get update && sudo apt-get install -y alien
              alien --to-rpm --scripts "${{ matrix.asset_name }}.deb"
              mv sentinela-*.rpm "${{ matrix.asset_name }}.rpm"
              shasum -a 256 "${{ matrix.asset_name }}.rpm" > "${{ matrix.asset_name }}.rpm.sha256"
            fi
          fi

      - name: Package Release Assets (Windows - zip & NSIS Setup)
        if: matrix.archive_format == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" -Destination dist/
          Copy-Item "scripts/install.ps1" -Destination dist/
          Copy-Item "scripts/install.bat" -Destination dist/
          Copy-Item "README.md" -Destination dist/
          Copy-Item "LICENSE" -Destination dist/

          # 1. Zip Portátil
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.asset_name }}.zip" -Force
          $hashZip = (Get-FileHash -Algorithm SHA256 "${{ matrix.asset_name }}.zip").Hash.ToLower()
          "$hashZip  ${{ matrix.asset_name }}.zip" | Out-File -Encoding ascii "${{ matrix.asset_name }}.zip.sha256"

          # 2. Instalador Gráfico Oficial NSIS (Setup Wizard)
          makensis scripts/installer.nsi
          $setupExe = "sentinela-windows-x64-setup.exe"
          $hashSetup = (Get-FileHash -Algorithm SHA256 $setupExe).Hash.ToLower()
          "$hashSetup  $setupExe" | Out-File -Encoding ascii "$setupExe.sha256"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            *.tar.gz
            *.zip
            *.deb
            *.rpm
            *.exe
            *.sha256

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums
        shell: bash
        run: |
          cd release-assets
          cat *.sha256 > SHA256SUMS.txt
          rm -f *.sha256
          echo "=== Checksums gerados ==="
          cat SHA256SUMS.txt

      - name: Determine Release Tag
        id: get_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: "Sentinela ${{ steps.get_tag.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/*
