name: Release Sentinela

"on":
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de versao para lancamento (ex: v0.3.0)'
        required: false
        default: 'v0.3.0'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install alien for RPM packaging
        run: |
          sudo apt-get update
          sudo apt-get install -y alien dpkg-dev

      - name: Build Release Binary
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Package Linux Assets
        run: |
          bash scripts/package-linux.sh target/x86_64-unknown-linux-gnu/release/sentinela x86_64-unknown-linux-gnu sentinela-linux-x86_64

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-assets
          path: |
            *.tar.gz
            *.deb
            *.rpm
            *.sha256

  build-windows:
    name: Build (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Release Binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package Windows Assets (Zip & NSIS Setup)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/sentinela.exe" -Destination dist/
          Copy-Item "scripts/install.ps1" -Destination dist/
          Copy-Item "scripts/install.bat" -Destination dist/
          Copy-Item "README.md" -Destination dist/
          Copy-Item "LICENSE" -Destination dist/

          # 1. Zip Portatil
          Compress-Archive -Path dist/* -DestinationPath "sentinela-windows-x64.zip" -Force
          $hashZip = (Get-FileHash -Algorithm SHA256 "sentinela-windows-x64.zip").Hash.ToLower()
          "$hashZip  sentinela-windows-x64.zip" | Out-File -Encoding ascii "sentinela-windows-x64.zip.sha256"

          # 2. Instalador Grafico Oficial NSIS (Setup Wizard)
          choco install -y nsis
          $makensisPath = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $makensisPath)) {
            $makensisPath = "makensis"
          }
          & $makensisPath scripts/installer.nsi
          $setupExe = "sentinela-windows-x64-setup.exe"
          $hashSetup = (Get-FileHash -Algorithm SHA256 $setupExe).Hash.ToLower()
          "$hashSetup  $setupExe" | Out-File -Encoding ascii "$setupExe.sha256"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: |
            *.zip
            *.exe
            *.sha256

  release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums
        shell: bash
        run: |
          cd release-assets
          cat *.sha256 > SHA256SUMS.txt
          rm -f *.sha256
          echo "=== Checksums gerados ==="
          cat SHA256SUMS.txt

      - name: Determine Release Tag
        id: get_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: "Sentinela ${{ steps.get_tag.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/*
